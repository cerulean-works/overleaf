name: ${COMPOSE_PROJECT_NAME:-overleaf}

services:
  sharelatex:
    build:
      context: .
      dockerfile: server-ce/Dockerfile
      target: community
      args:
        TEXLIVE_RELEASE: ${TEXLIVE_RELEASE:-2026}
        TEXLIVE_ARCH: ${TEXLIVE_ARCH:-x86_64-linux}
        TEXLIVE_BASELINE: ${TEXLIVE_BASELINE:-basic-v1}
        TEXLIVE_MIRROR: ${TEXLIVE_MIRROR:-https://mirror.ox.ac.uk/sites/ctan.org/systems/texlive/tlnet}
    image: overleaf-source:local
    platform: ${OVERLEAF_PLATFORM:-linux/amd64}
    restart: unless-stopped
    depends_on:
      mongo-init:
        condition: service_completed_successfully
      mongo:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - '${OVERLEAF_BIND_ADDRESS:-127.0.0.1}:${OVERLEAF_PORT:-8080}:80'
    stop_grace_period: 60s
    env_file:
      - path: .env
        required: false
    environment:
      OVERLEAF_APP_NAME: ${OVERLEAF_APP_NAME:-Overleaf}
      OVERLEAF_NAV_TITLE: ${OVERLEAF_NAV_TITLE:-Overleaf}
      OVERLEAF_SITE_URL: ${OVERLEAF_SITE_URL:-http://localhost:8080}
      OVERLEAF_MONGO_URL: mongodb://mongo:27017/sharelatex?replicaSet=overleaf
      OVERLEAF_REDIS_HOST: redis
      REDIS_HOST: redis
      OVERLEAF_INVITE_TOKEN_SECRET: ${OVERLEAF_INVITE_TOKEN_SECRET:-}
      OVERLEAF_SESSION_SECRET: ${OVERLEAF_SESSION_SECRET:-}
      ENABLED_LINKED_FILE_TYPES: project_file,project_output_file
      EMAIL_CONFIRMATION_DISABLED: 'true'
      SANDBOXED_COMPILES: 'false'
    volumes:
      - app-data:/var/lib/overleaf
      - texlive:/usr/local/texlive
    healthcheck:
      test: ['CMD', 'curl', '--fail', '--silent', 'http://localhost/status']
      interval: 20s
      timeout: 10s
      retries: 6
      start_period: 90s

  mongo:
    image: mongo:8.0
    restart: unless-stopped
    command: ['mongod', '--replSet', 'overleaf', '--bind_ip_all']
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - 'quit(db.hello().isWritablePrimary ? 0 : 1)'
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  mongo-init:
    image: mongo:8.0
    restart: 'no'
    depends_on:
      mongo:
        condition: service_started
    entrypoint: ['bash', '/scripts/init-mongo.sh']
    volumes:
      - ./server-ce/scripts/init-mongo.sh:/scripts/init-mongo.sh:ro
      - ./server-ce/scripts/init-mongo.js:/scripts/init-mongo.js:ro

  redis:
    image: redis:6.2
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  app-data:
  mongo-data:
  redis-data:
  texlive:
    name: ${COMPOSE_PROJECT_NAME:-overleaf}-texlive-${TEXLIVE_RELEASE:-2026}-${TEXLIVE_ARCH:-x86_64-linux}-${TEXLIVE_BASELINE:-basic-v1}
